            { provider: "Alibaba Cloud", model: "Qwen3.8 Max", aaIndex: 40, costTask: "$2.67", speedTps: "39 t/s", ttft: "2.7s", type: "MoE Frontier" },
            { provider: "Nebius AI", model: "gpt-oss-120b (high)", aaIndex: 35, costTask: "$0.04", speedTps: "182 t/s", ttft: "0.9s", type: "Open Weight Sovereign" }
        ];

        // --- MAIN STRATEGY BOARD COMPONENT ---
        const StrategyBoard = () => {
            const [search, setSearch] = React.useState("");
            const [selectedTag, setSelectedTag] = React.useState("Alle Modellen");
            const [filterVendor, setFilterVendor] = React.useState("All");
            const [filterAction, setFilterAction] = React.useState("All");
            const [activeTab, setActiveTab] = React.useState("models"); // 'models' or 'benchmarks'

            const tags = [
                "Alle Modellen",
                "Reasoning & Logic",
                "Multimodaal Vlaggenschip",
                "EU AI Act & On-Premise",
                "Agenten & Automatisering"
            ];

            const vendors = ["All", ...new Set(aiTools.map(t => t.vendor))];
            const actions = ["All", ...new Set(aiTools.map(t => t.action))];

            const filteredTools = aiTools.filter(tool => {
                const matchesSearch = tool.name.toLowerCase().includes(search.toLowerCase()) || 
                                      tool.description.toLowerCase().includes(search.toLowerCase()) ||
                                      tool.vendor.toLowerCase().includes(search.toLowerCase()) ||
                                      tool.benchmark.toLowerCase().includes(search.toLowerCase());
                
                const matchesTag = selectedTag === "Alle Modellen" || tool.tag === selectedTag;
                const matchesVendor = filterVendor === "All" || tool.vendor === filterVendor;
                const matchesAction = filterAction === "All" || tool.action === filterAction;

                return matchesSearch && matchesTag && matchesVendor && matchesAction;
            });

            return (
                <main class="max-w-7xl mx-auto px-6 pt-12">
                    {/* Hero Header */}
                    <div class="mb-8">
                        <div class="inline-flex items-center gap-2 bg-black text-white px-3 py-1 text-xs font-semibold uppercase tracking-widest mb-4 rounded-[2px]">
                            <span>Artificial Analysis Verified Benchmarks 2026</span>
                        </div>
                        <h1 class="text-5xl md:text-6xl text-[#000000] mb-4">
                            Strategic AI Model &amp; Inference Audit
                        </h1>
                        <p class="text-lg text-[#555c66] max-w-3xl font-light leading-relaxed">
                            Geanalyseerde prestaties en benchmarks van meer dan 500 AI-model endpoints (Artificial Analysis Index, verwerkingssnelheid in tokens/sec, latency en kosten per taak) voor onderbouwde enterprise AI-keuzes.
                        </p>
                    </div>

                    {/* Primary Tab Switcher */}
                    <div class="flex items-center gap-3 mb-8 border-b border-[#e6ebec] pb-4">
                        <button 
                            onClick={() => setActiveTab("models")}
                            class={`px-5 py-2.5 text-xs font-semibold uppercase tracking-wider transition-all rounded-[2px] ${activeTab === 'models' ? 'bg-[#191b1f] text-white' : 'bg-white text-[#555c66] border border-[#e6ebec] hover:bg-[#f6f9f9]'}`}
                        >
                            Frontier Modellen Overzicht
                        </button>
                        <button 
                            onClick={() => setActiveTab("benchmarks")}
                            class={`px-5 py-2.5 text-xs font-semibold uppercase tracking-wider transition-all rounded-[2px] flex items-center gap-2 ${activeTab === 'benchmarks' ? 'bg-[#191b1f] text-white' : 'bg-white text-[#555c66] border border-[#e6ebec] hover:bg-[#f6f9f9]'}`}
                        >
                            <span>Artificial Analysis Providers Leaderboard</span>
                            <span class="bg-[#186f64] text-white text-[10px] px-1.5 py-0.5 rounded font-mono">LIVE DATA</span>
                        </button>
                    </div>

                    {activeTab === "models" && (
                        <div>
                            {/* Category Filter Tabs */}
                            <div class="flex items-center gap-2 overflow-x-auto pb-4 mb-8">
                                {tags.map(t => (
                                    <button 
                                        key={t}
                                        onClick={() => setSelectedTag(t)}
                                        class={`tab-btn whitespace-nowrap ${selectedTag === t ? 'active' : ''}`}
                                    >
                                        {t}
                                    </button>
                                ))}
                            </div>

                            {/* Filter & Search Bar */}
                            <div class="bg-white border border-[#e6ebec] p-6 mb-10 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 items-end">
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-[#9fabad] mb-2">Zoek Model / Benchmark</label>
                                    <input 
                                        type="text"
                                        placeholder="Bijv. Fable 5.1, Astra, Sol, Gemini 3.8..."
                                        value={search}
                                        onChange={(e) => setSearch(e.target.value)}
                                        class="w-full bg-[#f6f9f9] border border-[#e6ebec] px-3 py-2 text-sm text-[#191b1f] focus:outline-none focus:border-[#191b1f]"
                                    />
                                </div>

                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-[#9fabad] mb-2">Vendor / Provider</label>
                                    <select 
                                        value={filterVendor} 
                                        onChange={(e) => setFilterVendor(e.target.value)}
                                        class="w-full bg-[#f6f9f9] border border-[#e6ebec] px-3 py-2 text-sm text-[#191b1f] focus:outline-none focus:border-[#191b1f]"
                                    >
                                        {vendors.map(v => <option key={v} value={v}>{v}</option>)}
                                    </select>
                                </div>

                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-[#9fabad] mb-2">Advies Actie</label>
                                    <select 
                                        value={filterAction} 
                                        onChange={(e) => setFilterAction(e.target.value)}
                                        class="w-full bg-[#f6f9f9] border border-[#e6ebec] px-3 py-2 text-sm text-[#191b1f] focus:outline-none focus:border-[#191b1f]"
                                    >
                                        {actions.map(a => <option key={a} value={a}>{a}</option>)}
                                    </select>
                                </div>

                                <div>
                                    <button 
                                        onClick={() => { setSearch(""); setSelectedTag("Alle Modellen"); setFilterVendor("All"); setFilterAction("All"); }}
                                        class="w-full bg-[#f6f9f9] hover:bg-[#e6ebec] border border-[#e6ebec] text-xs font-semibold uppercase tracking-wider text-[#191b1f] py-2.5 transition-colors"
                                    >
                                        Reset Filters
                                    </button>
                                </div>
                            </div>

                            {/* Results Counter */}
                            <div class="flex justify-between items-center mb-6 border-b border-[#e6ebec] pb-3">
                                <span class="text-xs uppercase tracking-wider font-semibold text-[#9fabad]">
                                    Getoonde Modellen: <strong class="text-[#191b1f]">{filteredTools.length}</strong> van {aiTools.length}
                                </span>
                                <span class="text-xs text-[#9fabad] hidden sm:inline">
                                    Bron: Artificial Analysis Leaderboard &bull; EU AI Act Verified
                                </span>
                            </div>

                            {/* Grid of AI Models */}
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-16">
                                {filteredTools.map(tool => (
                                    <div key={tool.id} class={`${tool.cardStyle} p-7 flex flex-col justify-between h-full relative`}>
                                        <div>
                                            <div class="flex justify-between items-start mb-4">
                                                <span class="text-2xl">{tool.icon}</span>
                                                <div class="flex items-center gap-2">
                                                    {tool.aaIndex && (
                                                        <span class="bg-black text-white text-[11px] font-mono px-2 py-0.5 font-bold rounded-[2px]" title="Artificial Analysis Intelligence Index Score">
                                                            AA Index: {tool.aaIndex}
                                                        </span>
                                                    )}
                                                    <span class={`badge-letter ${tool.badgeColor}`}>{tool.action}</span>
                                                </div>
                                            </div>

                                            <span class="text-xs uppercase tracking-widest text-[#9fabad] font-semibold block mb-1">
                                                {tool.vendor} &bull; {tool.category}
                                            </span>

                                            <h3 class="text-2xl text-[#000000] font-serif-heading mb-2">
                                                {tool.name}
                                            </h3>

                                            <div class="flex flex-wrap items-center gap-2 mb-4">
                                                <span class="inline-block text-[11px] font-mono bg-black/5 text-[#191b1f] px-2 py-0.5 rounded">
                                                    {tool.benchmark}
                                                </span>
                                                {tool.speedTps && (
                                                    <span class="inline-block text-[11px] font-mono bg-[#186f64]/10 text-[#186f64] font-semibold px-2 py-0.5 rounded">
                                                        ⚡ {tool.speedTps}
                                                    </span>
                                                )}
                                            </div>

                                            <p class="text-sm text-[#191b1f] leading-relaxed mb-6 font-normal">
                                                {tool.description}
                                            </p>
                                        </div>

                                        <div class="pt-4 border-t border-black/10">
                                            <div class="flex justify-between items-center text-xs mb-2">
                                                <span class="text-[#9fabad] uppercase font-semibold">Status</span>
                                                <span class="font-medium text-[#191b1f]">{tool.maturity}</span>
                                            </div>
                                            <div class="flex justify-between items-center text-xs mb-2">
                                                <span class="text-[#9fabad] uppercase font-semibold">ROI Focus</span>
                                                <span class="font-semibold text-[#186f64]">{tool.roi}</span>
                                            </div>
                                            <div class="flex justify-between items-center text-xs mt-3 pt-2 border-t border-black/5">
                                                <span class="text-[#9fabad] uppercase font-semibold">Indicatie Kosten</span>
                                                <span class="font-mono text-xs font-semibold text-[#191b1f]">{tool.price}</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {activeTab === "benchmarks" && (
                        <div class="mb-16">
                            <div class="bg-white border border-[#e6ebec] p-6 mb-8">
                                <h2 class="text-3xl font-serif-heading mb-2 text-[#000000]">
                                    Artificial Analysis API Providers Leaderboard
                                </h2>
                                <p class="text-sm text-[#555c66] mb-6 max-w-3xl">
                                    Onafhankelijk gemeten prestaties van top AI-modellen over verschillende cloud-infrastructuur providers (Amazon Bedrock, Azure, Google AI Studio, Groq, Cerebras, Nebius).
                                </p>

                                <div class="overflow-x-auto">
                                    <table class="w-full text-left border-collapse text-sm">
                                        <thead>
                                            <tr class="border-b border-[#e6ebec] bg-[#f6f9f9] text-[11px] font-semibold uppercase tracking-wider text-[#9fabad]">
                                                <th class="py-3 px-4">Provider Endpoint</th>
                                                <th class="py-3 px-4">Model Name</th>
                                                <th class="py-3 px-4 text-center">AA Intelligence Index</th>
                                                <th class="py-3 px-4 text-center">Output Speed (Tokens/s)</th>
                                                <th class="py-3 px-4 text-center">Latency / TTFT</th>
                                                <th class="py-3 px-4 text-right">Cost / Task (USD)</th>
                                                <th class="py-3 px-4 text-right">Type</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-[#e6ebec]">
                                            {providerLeaderboard.map((item, i) => (
                                                <tr key={i} class="hover:bg-[#f6f9f9] transition-colors">
                                                    <td class="py-3.5 px-4 font-semibold text-[#191b1f]">{item.provider}</td>
                                                    <td class="py-3.5 px-4 font-serif-heading text-base text-[#000000]">{item.model}</td>
                                                    <td class="py-3.5 px-4 text-center">
                                                        <span class="inline-block font-mono text-xs font-bold bg-black text-white px-2.5 py-0.5 rounded-[2px]">
                                                            {item.aaIndex}
                                                        </span>
                                                    </td>
                                                    <td class="py-3.5 px-4 text-center font-mono font-semibold text-[#186f64]">
                                                        ⚡ {item.speedTps}
                                                    </td>
                                                    <td class="py-3.5 px-4 text-center font-mono text-xs text-[#555c66]">
                                                        {item.ttft}
                                                    </td>
                                                    <td class="py-3.5 px-4 text-right font-mono text-xs font-semibold text-[#191b1f]">
                                                        {item.costTask}
                                                    </td>
                                                    <td class="py-3.5 px-4 text-right">
                                                        <span class="text-[10px] uppercase font-semibold tracking-wider text-[#9fabad] bg-black/5 px-2 py-0.5 rounded-[2px]">
                                                            {item.type}
                                                        </span>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                </main>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StrategyBoard />);
    </script>
</body>

</html>
